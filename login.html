<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login -- SmartJobs</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        <i class="bi bi-briefcase-fill text-primary me-1"></i>Smart<span class="text-primary">Jobs</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto text-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex gap-2 mt-3 mt-lg-0 justify-content-center" id="navAuthArea">
          <a href="login.html" class="btn btn-outline-primary">Login</a>
          <a href="register.html" class="btn btn-primary">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===================== LOGIN SECTION ===================== -->
  <section class="py-5 bg-light-section">
    <div class="container">
      <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-briefcase-fill text-primary fs-2"></i>
          <h3 class="fw-bold mt-2 mb-1">Welcome Back</h3>
          <p class="text-secondary small mb-0">Login to continue to SmartJobs</p>
        </div>

        <form id="loginForm" novalidate>

          <div class="mb-3">
            <label for="email" class="form-label small fw-medium">Email</label>
            <div class="input-group has-validation">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-medium">Password</label>
            <div class="input-group has-validation">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label small" for="rememberMe">Remember Me</label>
            </div>
            <a href="#" class="small">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Login</button>

          <p class="text-center small text-secondary mt-4 mb-0">
            Don't have an account?
            <a href="register.html" class="fw-medium">Register here</a>
          </p>
        </form>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
