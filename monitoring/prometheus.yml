global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The SmartJobs app exposes Prometheus metrics at /metrics (service name "app" in docker-compose).
  - job_name: smart-job-portal
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  # Prometheus monitoring itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
