<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Jobs -- SmartJobs</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        <i class="bi bi-briefcase-fill text-primary me-1"></i>Smart<span class="text-primary">Jobs</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto text-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex gap-2 mt-3 mt-lg-0 justify-content-center" id="navAuthArea">
          <a href="login.html" class="btn btn-outline-primary">Login</a>
          <a href="register.html" class="btn btn-primary">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===================== PAGE HEADER ===================== -->
  <section class="py-4 bg-light-section">
    <div class="container">
      <h2 class="fw-bold mb-1">Browse Jobs</h2>
      <p class="text-secondary mb-0">Showing <span id="resultCount">0</span> opportunities for students & freshers</p>
    </div>
  </section>

  <!-- ===================== JOBS + FILTERS ===================== -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4">

        <!-- FILTER SIDEBAR -->
        <div class="col-lg-3">
          <div class="card filter-card p-3">
            <h6 class="fw-semibold mb-3">Filters</h6>
            <form id="filterForm">
              <label class="form-label small fw-medium">Search</label>
              <input type="text" id="filterSearch" class="form-control form-control-sm mb-3" placeholder="Title, company, skill" />

              <label class="form-label small fw-medium">Location</label>
              <input type="text" id="filterLocation" class="form-control form-control-sm mb-3" placeholder="City" />

              <label class="form-label small fw-medium">Category</label>
              <select id="filterCategory" class="form-select form-select-sm mb-3">
                <option selected>All Categories</option>
                <option>Web Development</option>
                <option>Software Development</option>
                <option>Data Science</option>
                <option>UI/UX Design</option>
                <option>Cyber Security</option>
                <option>Digital Marketing</option>
              </select>

              <label class="form-label small fw-medium">Job Type</label>
              <select id="filterType" class="form-select form-select-sm mb-3">
                <option selected>All Types</option>
                <option>Internship</option>
                <option>Full-time</option>
                <option>Part-time</option>
              </select>

              <label class="form-label small fw-medium">Experience</label>
              <select id="filterExperience" class="form-select form-select-sm mb-3">
                <option selected>Any Experience</option>
                <option>Fresher</option>
                <option>0–1 Years</option>
                <option>1–3 Years</option>
              </select>

              <button type="submit" class="btn btn-primary btn-sm w-100 mb-2">Apply Filters</button>
              <button type="button" id="resetFilters" class="btn btn-outline-secondary btn-sm w-100">Reset</button>
            </form>
          </div>
        </div>

        <!-- JOB LISTINGS -->
        <div class="col-lg-9">
          <div id="emptyState" class="text-center py-5 d-none">
            <i class="bi bi-search display-4 text-secondary"></i>
            <p class="text-secondary mt-3 mb-0">No jobs match those filters. Try broadening your search.</p>
          </div>
          <div class="row g-4" id="jobsContainer">
            <div class="col-12 text-center text-secondary py-5">
              <div class="spinner-border text-primary" role="status"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Prefill filters from URL query params (e.g. jobs.html?category=Data%20Science
    // coming from the homepage category cards, or ?search=&location= from the
    // homepage hero search box).
    (function prefillFromQuery() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("search")) document.getElementById("filterSearch").value = params.get("search");
      if (params.get("location")) document.getElementById("filterLocation").value = params.get("location");
      if (params.get("category")) document.getElementById("filterCategory").value = params.get("category");
    })();
  </script>
  <script src="js/jobs.js"></script>
</body>
</html>
