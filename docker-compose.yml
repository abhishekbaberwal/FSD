services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-job-portal:latest
    container_name: smart-job-portal
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - smartjobs-data:/app/backend/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: smart-job-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: smart-job-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/smart-job-portal.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  smartjobs-data:
  grafana-data:
